<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >
  <title>US Courier — Admin Login</title>

  <link rel="stylesheet" href="/css/styles.css">

  <style>
    html,
    body {
      min-height: 100%;
    }

    body.admin-login-page {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(212, 175, 55, 0.10),
          transparent 42%
        ),
        #080b10;
      color: var(--text-main, #f4f6f8);
    }

    .standalone-admin-login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .standalone-admin-login-card {
      width: min(100%, 430px);
      padding: 34px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.015)
        ),
        rgba(11,15,21,.96);
      box-shadow:
        0 24px 70px rgba(0,0,0,.42);
    }

    .standalone-admin-login-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .standalone-admin-login-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(212,175,55,.12);
      border: 1px solid rgba(212,175,55,.32);
      color: #d4af37;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .standalone-admin-login-brand h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: .01em;
    }

    .standalone-admin-login-brand p {
      margin: 7px 0 0;
      color: var(--text-muted, #8d98a8);
      font-size: .82rem;
    }

    .standalone-admin-login-form {
      display: grid;
      gap: 18px;
    }

    .standalone-admin-login-field {
      display: grid;
      gap: 7px;
    }

    .standalone-admin-login-field label {
      color: var(--text-secondary, #b4bdc9);
      font-size: .78rem;
      font-weight: 700;
    }

    .standalone-admin-login-field input {
      width: 100%;
      box-sizing: border-box;
      min-height: 48px;
    }

    .standalone-admin-login-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      cursor: pointer;
    }

    .standalone-admin-login-status {
      min-height: 20px;
      margin-top: 2px;
      color: #d7dde5;
      font-size: .78rem;
      line-height: 1.45;
      text-align: center;
    }

    .standalone-admin-login-status.error {
      color: #f0a8a8;
    }

    .standalone-admin-login-status.success {
      color: #9ed6b1;
    }

    .standalone-admin-login-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: var(--text-muted, #8d98a8);
      font-size: .7rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 520px) {
      .standalone-admin-login {
        padding: 16px;
      }

      .standalone-admin-login-card {
        padding: 25px 20px;
        border-radius: 15px;
      }
    }
  </style>
</head>

<body class="admin-login-page">

  <main
    class="standalone-admin-login"
    aria-labelledby="admin-login-title"
  >
    <section
      class="standalone-admin-login-card"
      aria-label="US Courier administrator sign in"
    >
      <div class="standalone-admin-login-brand">
        <div
          class="standalone-admin-login-mark"
          aria-hidden="true"
        >
          D
        </div>

        <h1 id="admin-login-title">
          US Courier Admin
        </h1>

        <p>
          Authorized Operations Management Portal
        </p>
      </div>

      <form
        id="standalone-admin-login-form"
        class="standalone-admin-login-form"
        autocomplete="on"
        novalidate
      >
        <div class="standalone-admin-login-field">
          <label for="standalone-login-email">
            Operator Email
          </label>

          <input
            type="email"
            id="standalone-login-email"
            name="email"
            class="form-control"
            autocomplete="username"
            inputmode="email"
            maxlength="254"
            required
          >
        </div>

        <div class="standalone-admin-login-field">
          <label for="standalone-login-password">
            Password
          </label>

          <input
            type="password"
            id="standalone-login-password"
            name="password"
            class="form-control"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          id="standalone-admin-login-submit"
          class="btn-gold standalone-admin-login-submit"
        >
          Sign In
        </button>

        <div
          id="standalone-admin-login-status"
          class="standalone-admin-login-status"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <div class="standalone-admin-login-footer">
        Authorized personnel only. Access is protected by
        server-side authentication and role-based permissions.
      </div>
    </section>
  </main>

  <script src="/js/admin-login.js"></script>
</body>
</html>
