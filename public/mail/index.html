<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="USCourier secure business email"><title>USCourier Mail — Secure Business Email</title><link rel="stylesheet" href="/mail/mail.css"></head><body><div class="mail-shell"><header class="mail-header"><div class="brand">USCourier <span>MAIL</span></div><div class="search"><input type="search" placeholder="Search mail" aria-label="Search mail"></div><div aria-label="Account">●</div></header><div class="layout"><aside class="sidebar"><button class="compose" type="button">＋ Compose</button><nav aria-label="Mailbox folders"><div class="nav-item active"><span>Inbox</span><b>0</b></div><div class="nav-item"><span>★ Starred</span></div><div class="nav-item"><span>Drafts</span></div><div class="nav-item"><span>Sent</span></div><div class="nav-item"><span>Archive</span></div><div class="nav-item"><span>Trash</span></div></nav></aside><main class="main"><h2>Inbox</h2><div class="subtitle">Your business messages will appear here.</div><div class="mail-toolbar"><button type="button" aria-label="Select messages">□</button><button type="button" aria-label="Refresh">↻</button><span></span><button type="button" aria-label="Previous">‹</button><button type="button" aria-label="Next">›</button></div><div class="mail-content"><section class="message-list"><div class="list-head"><strong>Inbox</strong><span>0 messages</span></div><div class="message-empty">No messages yet</div></section><section class="reader"><div class="reader-empty"><div class="reader-icon">✉</div><h3>Open an email</h3><p>Select a message to read it here.</p></div></section></div></main></div></div><div class="compose-modal" id="composeModal" hidden><div class="compose-card"><div class="compose-head"><strong>New message</strong><button type="button" id="closeCompose">×</button></div><input id="composeTo" type="email" placeholder="To"><div class="compose-recipient-row"><input id="composeCc" type="text" placeholder="Cc"><input id="composeBcc" type="text" placeholder="Bcc"></div><input id="composeSubject" type="text" placeholder="Subject"><textarea id="composeBody" placeholder="Write your message…"></textarea><div class="compose-foot"><label class="attach-btn" for="composeAttachment">Attach file</label><input id="composeAttachment" type="file" hidden><span id="attachmentStatus">No file attached</span><button type="button" id="sendMail">Send</button><button type="button" id="saveDraft">Save draft</button></div></div></div><script src="/mail/mail.js"></script></body></html>
