<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 180"
     role="img"
     aria-labelledby="title desc">
  <title id="title">USCOURIER</title>
  <desc id="desc">USCOURIER professional courier and logistics logo.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Courier symbol -->
  <g transform="translate(18 18)">
    <!-- Parcel -->
    <path
      d="M38 42 L82 20 L126 42 L126 100 L82 124 L38 100 Z"
      fill="none"
      stroke="url(#sky)"
      stroke-width="9"
      stroke-linejoin="round"/>

    <!-- Parcel top -->
    <path
      d="M38 42 L82 66 L126 42"
      fill="none"
      stroke="#38BDF8"
      stroke-width="9"
      stroke-linejoin="round"/>

    <!-- Parcel fold -->
    <path
      d="M82 66 V124"
      fill="none"
      stroke="#0284C7"
      stroke-width="8"
      stroke-linecap="round"/>

    <!-- Gold package detail -->
    <path
      d="M82 66 V31"
      fill="none"
      stroke="#D4AF37"
      stroke-width="8"
      stroke-linecap="round"/>

    <!-- Forward movement -->
    <path
      d="M103 91 C124 91 139 84 151 70 L165 54"
      fill="none"
      stroke="#D4AF37"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M148 54 L166 53 L161 71"
      fill="none"
      stroke="#D4AF37"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Route -->
    <path
      d="M20 132 C57 145 104 145 139 128"
      fill="none"
      stroke="#38BDF8"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="3 12"/>

    <circle cx="20" cy="132" r="6" fill="#D4AF37"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(205 48)">
    <text
      x="0"
      y="62"
      font-family="Tahoma, Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="800"
      letter-spacing="2"
      fill="#0F172A">USCOURIER</text>

    <rect
      x="2"
      y="78"
      width="72"
      height="5"
      rx="2.5"
      fill="#D4AF37"/>

    <text
      x="0"
      y="112"
      font-family="Tahoma, Arial, Helvetica, sans-serif"
      font-size="18"
      font-weight="600"
      letter-spacing="4"
      fill="#475569">LOGISTICS • DELIVERY</text>

    <text
      x="0"
      y="140"
      font-family="Tahoma, Arial, Helvetica, sans-serif"
      font-size="12"
      font-weight="500"
      letter-spacing="2.5"
      fill="#64748B">SECURE • FAST • CONNECTED</text>
  </g>
</svg>
