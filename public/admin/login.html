<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">

  <title>US Courier | Admin Login</title>

  <meta
    name="description"
    content="US Courier secure administrative operations portal."
  >

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/icons.css">

  <style>
    :root {
      --admin-bg: #f4f7fb;
      --admin-card: #ffffff;
      --admin-border: #e2e8f0;
      --admin-text: #172033;
      --admin-muted: #64748b;
      --admin-primary: #123b67;
      --admin-primary-dark: #0b2b4b;
      --admin-danger: #b42318;
      --admin-success: #067647;
      --admin-radius: 18px;
      --admin-shadow: 0 20px 60px rgba(15, 23, 42, .12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--admin-bg);
      color: var(--admin-text);
    }

    body {
      min-height: 100vh;
    }

    .admin-login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .admin-login-header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: #fff;
      border-bottom: 1px solid var(--admin-border);
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .admin-brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--admin-primary);
      color: #fff;
      font-weight: 900;
    }

    .admin-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .admin-brand-text strong {
      font-size: 15px;
    }

    .admin-brand-text span {
      margin-top: 4px;
      font-size: 10px;
      color: var(--admin-muted);
      letter-spacing: .15em;
    }

    .admin-security-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--admin-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .admin-security-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #12b76a;
    }

    .admin-login-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 50px 20px;
    }

    .admin-login-card {
      width: min(100%, 470px);
      padding: 42px;
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: var(--admin-radius);
      box-shadow: var(--admin-shadow);
    }

    .admin-login-heading {
      margin-bottom: 30px;
    }

    .admin-login-heading .eyebrow {
      margin: 0 0 9px;
      color: var(--admin-primary);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .admin-login-heading h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 36px);
      line-height: 1.1;
    }

    .admin-login-heading p {
      margin: 12px 0 0;
      color: var(--admin-muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .admin-field {
      margin-bottom: 20px;
    }

    .admin-field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .admin-field input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--admin-text);
      font-size: 15px;
      transition: border-color .15s, box-shadow .15s;
    }

    .admin-field input:focus {
      border-color: var(--admin-primary);
      box-shadow: 0 0 0 3px rgba(18, 59, 103, .1);
    }

    .admin-login-submit {
      width: 100%;
      min-height: 52px;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      background: var(--admin-primary);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .03em;
      transition: background .15s, transform .15s;
    }

    .admin-login-submit:hover {
      background: var(--admin-primary-dark);
    }

    .admin-login-submit:active {
      transform: translateY(1px);
    }

    .admin-login-submit:disabled {
      opacity: .65;
      cursor: wait;
    }

    #standalone-admin-login-status {
      display: none;
      margin: 18px 0 0;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    #standalone-admin-login-status.error {
      display: block;
      color: var(--admin-danger);
      background: #fef3f2;
      border: 1px solid #fecdca;
    }

    #standalone-admin-login-status.success {
      display: block;
      color: var(--admin-success);
      background: #ecfdf3;
      border: 1px solid #abefc6;
    }

    .admin-login-footer {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--admin-border);
      color: var(--admin-muted);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 600px) {
      .admin-login-header {
        height: 68px;
        padding: 0 18px;
      }

      .admin-security-label {
        display: none;
      }

      .admin-login-main {
        padding: 28px 15px;
      }

      .admin-login-card {
        padding: 30px 22px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body class="admin-standalone-page">

  <div class="admin-login-page">

    <header class="admin-login-header">
      <div class="admin-brand">
        <div class="admin-brand-mark">US</div>

        <div class="admin-brand-text">
          <strong>US COURIER</strong>
          <span>OPERATIONS CONTROL</span>
        </div>
      </div>

      <div class="admin-security-label">
        <span class="admin-security-dot"></span>
        Secure Administrative Portal
      </div>
    </header>

    <main class="admin-login-main">
      <section class="admin-login-card">

        <div class="admin-login-heading">
          <p class="eyebrow">Operations Access</p>

          <h1>Administrator Login</h1>

          <p>
            Sign in to access shipment operations, live tracking,
            staff management, messages, and administrative controls.
          </p>
        </div>

        <form
          id="standalone-admin-login-form"
          novalidate
        >

          <div class="admin-field">
            <label for="standalone-login-email">
              Email address
            </label>

            <input
              id="standalone-login-email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="admin@example.com"
              required
            >
          </div>

          <div class="admin-field">
            <label for="standalone-login-password">
              Password
            </label>

            <div style="position:relative;">
              <input
                id="standalone-login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
                style="padding-right:72px;"
              >

              <button
                type="button"
                id="admin-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
                style="
                  position:absolute;
                  right:10px;
                  top:50%;
                  transform:translateY(-50%);
                  border:0;
                  background:transparent;
                  color:var(--admin-primary);
                  font-size:11px;
                  font-weight:800;
                  letter-spacing:.06em;
                  cursor:pointer;
                  padding:6px;
                "
              >
                SHOW
              </button>
            </div>
          </div>

          <button
            id="standalone-admin-login-submit"
            class="admin-login-submit"
            type="submit"
          >
            Sign In to Operations
          </button>

          <div
            id="standalone-admin-login-status"
            role="alert"
            aria-live="polite"
          ></div>

        </form>

        <div class="admin-login-footer">
          Authorized personnel only.<br>
          US Courier Operations Control
        </div>

      </section>
    </main>

  </div>

  <script src="/admin/js/admin-login.js"></script>

</body>
</html>
