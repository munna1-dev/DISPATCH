<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >

  <title>US Courier | Sign In</title>

  <meta
    name="description"
    content="Sign in to US Courier."
  >

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/icons.css">

  <style>
    /*
     * =========================================================
     * US COURIER LOGIN
     * Uses the same visual language as the main courier site.
     * =========================================================
     */

    :root {
      --login-bg: #090b10;
      --login-secondary: #0d1118;
      --login-card: #11161f;
      --login-input: #0b1017;
      --login-border: #202936;
      --login-border-soft: rgba(255,255,255,.07);

      --login-gold: #d4af37;
      --login-gold-hover: #f0c94b;
      --login-gold-soft: rgba(212,175,55,.12);

      --login-text: #f5f7fa;
      --login-muted: #8d98a8;
      --login-dim: #687384;

      --login-danger: #ff6262;
      --login-success: #35d07f;

      --login-radius: 16px;
      --login-shadow:
        0 24px 70px rgba(0,0,0,.45);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--login-bg);
    }

    body {
      min-height: 100vh;
      color: var(--login-text);
      font-family: var(--font-family);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    .admin-login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% -15%,
          rgba(212,175,55,.10),
          transparent 30rem
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(212,175,55,.035),
          transparent 24rem
        ),
        var(--login-bg);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .admin-login-header {
      width: 100%;
      height: 74px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 clamp(20px, 6vw, 84px);

      background: rgba(9,11,16,.88);
      border-bottom: 1px solid var(--login-border);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;

      color: var(--login-text);
      text-decoration: none;
    }

    .admin-brand-mark {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border: 1px solid var(--login-gold);
      border-radius: 9px;

      background:
        linear-gradient(
          145deg,
          rgba(212,175,55,.18),
          rgba(212,175,55,.04)
        );

      color: var(--login-gold);

      font-size: 13px;
      font-weight: 900;
      letter-spacing: .04em;

      box-shadow:
        0 0 0 4px rgba(212,175,55,.035);
    }

    .admin-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .admin-brand-text strong {
      color: var(--login-text);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .10em;
    }

    .admin-brand-text span {
      margin-top: 5px;

      color: var(--login-dim);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .admin-security-label {
      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--login-muted);

      font-size: 11px;
      font-weight: 600;
    }

    .admin-security-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--login-gold);

      box-shadow:
        0 0 10px rgba(212,175,55,.55);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .admin-login-main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        60px 20px
        70px;
    }

    .admin-login-card {
      width: min(100%, 430px);

      padding: 38px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.025),
          rgba(255,255,255,.008)
        ),
        var(--login-card);

      border: 1px solid var(--login-border);

      border-radius: var(--login-radius);

      box-shadow: var(--login-shadow);

      position: relative;
      overflow: hidden;
    }

    .admin-login-card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--login-gold),
          transparent
        );

      opacity: .9;
    }

    .admin-login-card::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -100px;
      bottom: -110px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(212,175,55,.07),
          transparent 70%
        );

      pointer-events: none;
    }

    /* =========================================================
       HEADING
    ========================================================= */

    .admin-login-heading {
      margin-bottom: 30px;
    }

    .admin-login-heading .eyebrow {
      margin: 0 0 9px;

      color: var(--login-gold);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .admin-login-heading h1 {
      margin: 0;

      color: var(--login-text);

      font-size: clamp(27px, 6vw, 34px);
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .admin-login-heading p:not(.eyebrow) {
      margin: 11px 0 0;

      color: var(--login-muted);

      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================================================
       FORM
    ========================================================= */

    .admin-field {
      margin-bottom: 19px;
    }

    .admin-field label {
      display: block;

      margin-bottom: 8px;

      color: var(--login-text);

      font-size: 12px;
      font-weight: 650;
    }

    .admin-input-wrap {
      position: relative;
    }

    .admin-field input {
      width: 100%;
      height: 50px;

      padding: 0 14px;

      border: 1px solid var(--login-border);

      border-radius: 9px;

      outline: none;

      background: var(--login-input);
      color: var(--login-text);

      font-size: 14px;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .admin-field input::placeholder {
      color: var(--login-dim);
    }

    .admin-field input:hover {
      border-color: rgba(255,255,255,.12);
    }

    .admin-field input:focus {
      border-color: var(--login-gold);

      background: #0d131b;

      box-shadow:
        0 0 0 3px rgba(212,175,55,.10);
    }

    .admin-password-input {
      padding-right: 70px !important;
    }

    .admin-password-toggle {
      position: absolute;

      right: 9px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: var(--login-gold);

      padding: 6px 7px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;

      cursor: pointer;

      border-radius: 5px;

      transition:
        color .15s ease,
        background .15s ease;
    }

    .admin-password-toggle:hover {
      color: var(--login-gold-hover);
      background: var(--login-gold-soft);
    }

    .admin-password-toggle:focus-visible {
      outline: 2px solid var(--login-gold);
      outline-offset: 2px;
    }

    /* =========================================================
       SUBMIT
    ========================================================= */

    .admin-login-submit {
      width: 100%;
      min-height: 50px;

      margin-top: 5px;

      border: 1px solid var(--login-gold);
      border-radius: 9px;

      background: var(--login-gold);
      color: #090b10;

      cursor: pointer;

      font-size: 13px;
      font-weight: 800;
      letter-spacing: .025em;

      box-shadow:
        0 7px 22px rgba(212,175,55,.12);

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }

    .admin-login-submit:hover {
      background: var(--login-gold-hover);
      border-color: var(--login-gold-hover);

      box-shadow:
        0 9px 28px rgba(212,175,55,.18);

      transform: translateY(-1px);
    }

    .admin-login-submit:active {
      transform: translateY(0);
    }

    .admin-login-submit:focus-visible {
      outline: 2px solid var(--login-gold-hover);
      outline-offset: 3px;
    }

    .admin-login-submit:disabled {
      opacity: .60;
      cursor: wait;
      transform: none;
    }

    /* =========================================================
       STATUS
    ========================================================= */

    #standalone-admin-login-status {
      display: none;

      margin-top: 16px;
      padding: 11px 13px;

      border-radius: 8px;

      font-size: 12px;
      line-height: 1.5;
    }

    #standalone-admin-login-status.error {
      display: block;

      color: var(--login-danger);

      background: rgba(255,98,98,.09);
      border: 1px solid rgba(255,98,98,.18);
    }

    #standalone-admin-login-status.success {
      display: block;

      color: var(--login-success);

      background: rgba(53,208,127,.07);
      border: 1px solid rgba(53,208,127,.16);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .admin-login-footer {
      margin-top: 26px;
      padding-top: 20px;

      border-top: 1px solid var(--login-border);

      color: var(--login-dim);

      font-size: 10px;
      line-height: 1.7;

      text-align: center;
    }

    .admin-login-footer strong {
      color: var(--login-muted);
      font-weight: 650;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {
      .admin-login-header {
        height: 68px;
        padding: 0 18px;
      }

      .admin-security-label {
        display: none;
      }

      .admin-login-main {
        align-items: flex-start;

        padding:
          42px 15px
          50px;
      }

      .admin-login-card {
        width: 100%;
        padding: 29px 22px 25px;

        border-radius: 13px;
      }

      .admin-login-heading h1 {
        font-size: 28px;
      }
    }

    @media (max-width: 360px) {
      .admin-brand-text strong {
        font-size: 13px;
      }

      .admin-brand-text span {
        display: none;
      }

      .admin-login-card {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>

<body class="admin-standalone-page">

  <div class="admin-login-page">

    <header class="admin-login-header">

      <div class="admin-brand">
        <div class="admin-brand-mark">US</div>

        <div class="admin-brand-text">
          <strong>US COURIER</strong>
          <span>Courier Services</span>
        </div>
      </div>

      <div class="admin-security-label">
        <span class="admin-security-dot"></span>
        Secure Sign In
      </div>

    </header>

    <main class="admin-login-main">

      <section
        class="admin-login-card"
        aria-labelledby="login-title"
      >

        <div class="admin-login-heading">

          <p class="eyebrow">
            Courier Portal
          </p>

          <h1 id="login-title">
            Welcome back
          </h1>

          <p>
            Sign in to continue to your US Courier
            operations portal.
          </p>

        </div>

        <form
          id="standalone-admin-login-form"
          novalidate
        >

          <div class="admin-field">

            <label for="standalone-login-email">
              Email address
            </label>

            <div class="admin-input-wrap">

              <input
                id="standalone-login-email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="Enter your email"
                required
              >

            </div>

          </div>

          <div class="admin-field">

            <label for="standalone-login-password">
              Password
            </label>

            <div class="admin-input-wrap">

              <input
                id="standalone-login-password"
                class="admin-password-input"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              >

              <button
                type="button"
                id="admin-password-toggle"
                class="admin-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                SHOW
              </button>

            </div>

          </div>

          <button
            id="standalone-admin-login-submit"
            class="admin-login-submit"
            type="submit"
          >
            Sign In Securely
          </button>

          <div
            id="standalone-admin-login-status"
            role="alert"
            aria-live="polite"
          ></div>

        </form>

        <div class="admin-login-footer">
          <strong>US Courier</strong><br>
          Secure access for authorized operations personnel.
        </div>

      </section>

    </main>

  </div>

  <script src="/admin/js/admin-login.js"></script>

</body>
</html>
